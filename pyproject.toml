[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "listmaker"
version = "0.1.0"
description = "Convert text lists into music playlists (Spotify, Anghami) - supports songs and podcasts"
requires-python = ">=3.8"
dependencies = [
    "typer[all]>=0.9.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "readchar>=4.2.0",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
listmaker = "listmaker.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
